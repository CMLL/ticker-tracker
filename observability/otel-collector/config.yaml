receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ticker-web
          scrape_interval: 15s
          static_configs:
            - targets: ["web:9090"]

exporters:
  prometheus_remote_write:
    http:
      endpoint: http://prometheus:9090/api/v1/write
      tls:
        insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus_remote_write]
