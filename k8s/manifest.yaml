---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    app: web
    app.kubernetes.io/part-of: ticker-tracker
data:
  MEMCACHED_ADDR: "memcached:11211"
  TICKER: "MSFT"
  NDAYS: "7"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  labels:
    app: memcached
    app.kubernetes.io/part-of: ticker-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
        app.kubernetes.io/part-of: ticker-tracker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 11211
        runAsGroup: 11211
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memcached
          image: memcached:1.6-alpine
          args: ["-m", "64"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: memcache
              containerPort: 11211
          readinessProbe:
            tcpSocket:
              port: memcache
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: memcache
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  labels:
    app: memcached
    app.kubernetes.io/part-of: ticker-tracker
spec:
  type: ClusterIP
  selector:
    app: memcached
  ports:
    - name: memcache
      port: 11211
      targetPort: memcache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: ticker-tracker
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: ticker-tracker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-memcached
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 memcached 11211; do echo waiting for memcached; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 16Mi
      containers:
        - name: web
          image: docker.io/cllamach/ticker_tracker:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: apikey
                  key: API_KEY
            - name: GOMEMLIMIT
              value: 115MiB
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 90
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: ticker-tracker
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: ticker-tracker
spec:
  rules:
      - http:
          paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: web
                  port:
                    name: http
            - path: /metrics
              pathType: Prefix
              backend:
                service:
                  name: web
                  port:
                    name: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memcached-allow-web
  labels:
    app: memcached
    app.kubernetes.io/part-of: ticker-tracker
spec:
  podSelector:
    matchLabels:
      app: memcached
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 11211
