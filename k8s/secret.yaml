# The secret below holds a placeholder. Set the real key before applying, e.g.:
#   kubectl create secret generic apikey --from-literal=API_KEY=<key> \
# With more time this could be encrypted before committed if possible.
apiVersion: v1
kind: Secret
metadata:
  name: apikey
  labels:
    app.kubernetes.io/name: APIKey
    app.kubernetes.io/part-of: ticker-tracker
type: Opaque
stringData:
  # IMPORTANT!!! Dont commit the secret
  API_KEY: "REPLACE_ME"
