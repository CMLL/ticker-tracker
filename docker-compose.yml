services:

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
    # 64MB is far more than one daily series needs; the default is 64 anyway,
    # set explicitly so the cap is visible.
    command: ["-m", "64"]
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc -w 1 localhost 11211 | grep -q uptime"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: cllamach/ticker_tracker:latest
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      MEMCACHED_ADDR: memcached:11211
      TICKER: ${TICKER}
      API_KEY: ${API_KEY}
      NDAYS: ${NDAYS}
    depends_on:
      memcached:
        condition: service_healthy
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - web
      - prometheus
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    restart: on-failure

  grafana:
    image: grafana/grafana:13.2.2
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: on-failure
